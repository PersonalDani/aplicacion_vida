<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#151316">
<title>Vida</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{
  --bg:#151316;
  --bg-elev:#1d1a1f;
  --bg-card:#242026;
  --border:#332e35;
  --text:#f6f2f0;
  --text-dim:#a39aa0;
  --accent:#ff9166;
  --accent-2:#ffc266;
  --danger:#ff5d73;
  --warn:#ffcf5c;
  --money-pos:#5ee68f;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
#app{min-height:100vh;display:flex;flex-direction:column;}
.hidden{display:none !important;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 8px;
  min-height:56px;
}
.topbar h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.02em;}
.topbar .date{font-size:13px;color:var(--text-dim);}
.back-btn{
  width:40px;height:40px;flex-shrink:0;padding:0;
  background:var(--bg-card);border:1px solid var(--border);color:var(--text);
  border-radius:50%;font-size:22px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s ease, background .1s ease;
}
.back-btn:active{transform:scale(0.82);background:var(--bg-elev);opacity:0.85;}

.avatar-btn{
  width:40px;height:40px;flex-shrink:0;padding:0;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  transition:transform .1s ease;
}
.avatar-btn:active{transform:scale(0.88);}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block;}

#view-home{flex:1;display:flex;flex-direction:column;min-height:0;}
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px 8px;
  padding:6px 18px 24px;flex:1;
}
.tile{
  background:none;border:none;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  position:relative;
}
.tile .icon-circle{
  width:min(84px,22vw);height:min(84px,22vw);border-radius:24px;
  background:linear-gradient(160deg,var(--bg-card),var(--bg-elev));
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  transition:transform .12s ease, box-shadow .12s ease;
}
.tile .icon-circle::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(60px 50px at var(--mx,50%) var(--my,0%), rgba(255,255,255,0.14), transparent 70%);
  opacity:0;transition:opacity .2s ease;pointer-events:none;
}
.tile:active .icon-circle{transform:scale(0.86);box-shadow:0 0 0 2px var(--tile-accent,var(--accent));}
.tile:active .icon-circle::after{opacity:1;}
.tile .icon{font-size:32px;line-height:1;}
.tile .icon-img{width:38px;height:38px;object-fit:contain;}
.tile .label{font-weight:600;font-size:13px;text-align:center;line-height:1.2;color:var(--text);}

.section{padding:16px 20px 40px;flex:1;display:flex;flex-direction:column;gap:16px;min-width:0;}
.card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:10px;
  overflow:hidden;min-width:0;box-sizing:border-box;
}
.card h3{margin:0;font-size:15px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;}
.btn{
  background:var(--accent);color:#04140f;border:none;border-radius:12px;
  padding:12px 16px;font-size:15px;font-weight:700;
  transition:transform .1s ease, filter .1s ease;
}
.btn:active{transform:scale(0.94);filter:brightness(0.9);}
.btn.secondary{background:var(--bg-elev);color:var(--text);border:1px solid var(--border);}
.btn.danger{background:var(--danger);color:#2a0a0a;}
input,textarea,select{
  background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:10px 12px;font-size:15px;width:100%;
  min-width:0;max-width:100%;box-sizing:border-box;
}
input[type="date"],input[type="time"]{
  width:1px;min-width:100%;
}
textarea{min-height:80px;resize:vertical;font-family:inherit;}
label{font-size:13px;color:var(--text-dim);display:block;margin-bottom:4px;}
.field{display:flex;flex-direction:column;gap:2px;min-width:0;}
.list{display:flex;flex-direction:column;gap:8px;}
.item{
  background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;
  padding:12px;display:flex;flex-direction:column;gap:4px;
  transition:transform .1s ease, filter .1s ease;
}
.item.item-tap:active{transform:scale(0.97);filter:brightness(0.9);}
.item .top{display:flex;justify-content:space-between;align-items:center;}
.item .meta{font-size:12px;color:var(--text-dim);}
.pill{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:rgba(94,230,200,0.15);color:var(--accent);
}
.pill.warn{background:rgba(245,197,66,0.15);color:var(--warn);}
.pill.danger{background:rgba(255,107,107,0.15);color:var(--danger);}
.icon-x{
  color:var(--text-dim);font-size:18px;padding:4px 8px;border-radius:8px;
}
.icon-x:active{background:var(--bg-card);}
.streak{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--warn);}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day-chip{
  aspect-ratio:1;border-radius:10px;background:var(--bg-elev);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:12px;font-weight:700;color:var(--text-dim);
  transition:transform .1s ease, filter .1s ease;
}
.day-chip .day-chip-num{font-size:10px;font-weight:600;opacity:0.85;}
.day-chip.done{background:var(--accent);color:#04140f;border-color:var(--accent);}
.day-chip.today{box-shadow:0 0 0 2px var(--accent) inset;}
.day-chip.selected{outline:2px solid var(--text);outline-offset:2px;}
.mandala-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.mandala-box{
  border-radius:16px;padding:12px 8px;min-height:92px;border:1px solid var(--border);
  background:var(--bg-elev);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  text-align:center;transition:transform .12s ease, filter .12s ease;overflow:hidden;
}
.mandala-box:active{transform:scale(0.93);filter:brightness(0.92);}
.mandala-box .mandala-title{font-weight:700;font-size:12px;line-height:1.2;word-break:break-word;}
.mandala-box .mandala-empty{opacity:0.5;font-size:24px;}
.mandala-box.done{background:var(--money-pos);color:#04140f;border-color:var(--money-pos);}
.mandala-progress-track{width:100%;height:5px;border-radius:4px;background:rgba(127,127,127,0.3);overflow:hidden;margin-top:2px;}
.mandala-box.done .mandala-progress-track{background:rgba(4,20,15,0.25);}
.mandala-progress-fill{height:100%;background:var(--money-pos);}
.mandala-box.done .mandala-progress-fill{background:#04140f;}
.mandala-pct{font-size:11px;font-weight:700;opacity:0.85;}
.day-chip:active{transform:scale(0.88);filter:brightness(0.9);}
.empty-msg{color:var(--text-dim);font-size:13px;text-align:center;padding:20px 0;}

#pin-screen{
  position:fixed;inset:0;background:var(--bg);z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;
}
#pin-screen h2{margin:0;font-size:20px;}
#pin-screen p{margin:0;color:var(--text-dim);font-size:13px;text-align:center;}
.pin-dots{display:flex;gap:14px;}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;}
.pin-key{
  width:72px;height:72px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);
  color:var(--text);font-size:24px;font-weight:600;
}
.pin-key:active{background:var(--bg-elev);transform:scale(0.94);}
.pin-error{color:var(--danger);font-size:13px;height:16px;}

#recovery-screen{
  position:fixed;inset:0;background:var(--bg);z-index:100;color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;
}

.focus-timer{font-size:52px;font-weight:800;letter-spacing:-0.02em;text-align:center;font-variant-numeric:tabular-nums;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(4,5,8,0.72);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
  width:100%;max-width:520px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
  overflow:hidden;box-sizing:border-box;
}
.modal-sheet h2{margin:0;font-size:19px;}
.modal-sheet p{margin:0;color:var(--text-dim);font-size:13px;}

.switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;transition:.15s;}
.switch .slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:var(--accent);border-color:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(20px);}

.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.cal-nav button{background:var(--bg-elev);border:1px solid var(--border);color:var(--text);border-radius:10px;width:36px;height:36px;font-size:18px;flex-shrink:0;}
.cal-nav button:active{transform:scale(0.92);}
.cal-month{font-weight:700;font-size:16px;text-transform:capitalize;}
.cal-month-btn{
  background:none;border:none;color:var(--text);font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 8px;border-radius:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
  transition:transform .1s ease, opacity .1s ease;
}
.cal-month-btn .cal-month-caret{font-size:11px;color:var(--text-dim);}
.cal-month-btn:active{transform:scale(0.94);opacity:0.7;}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.month-cell{
  padding:14px 0;border-radius:12px;background:var(--bg-elev);border:1px solid var(--border);
  color:var(--text);font-size:14px;font-weight:600;text-align:center;
  transition:transform .1s ease, filter .1s ease;
}
.month-cell.selected{background:var(--accent);color:#04140f;border-color:var(--accent);}
.month-cell:active{transform:scale(0.9);filter:brightness(0.9);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:11px;color:var(--text-dim);font-weight:700;padding-bottom:4px;}
.cal-day{
  aspect-ratio:1;border-radius:12px;background:var(--bg-elev);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:13px;font-weight:600;position:relative;
  transition:transform .1s ease, filter .1s ease;
}
.cal-day.today{border-color:var(--accent);color:var(--accent);}
.cal-day.selected{background:var(--accent);color:#04140f;}
.cal-day.empty{background:transparent;}
.cal-day:not(.empty):active{transform:scale(0.86);filter:brightness(0.85);}
.cal-day .dots{position:absolute;bottom:5px;display:flex;gap:2px;}
.cal-day .dot{width:5px;height:5px;border-radius:50%;}
.color-row{display:flex;gap:10px;flex-wrap:wrap;}
.color-swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;transition:transform .1s ease;}
.color-swatch.selected{border-color:#fff;}
.color-swatch:active{transform:scale(0.82);}
.event-color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

.idea-icon-picker{display:flex;gap:10px;flex-wrap:wrap;}
.idea-icon-opt{
  width:44px;height:44px;border-radius:50%;background:var(--bg-elev);border:2px solid transparent;
  font-size:20px;display:flex;align-items:center;justify-content:center;
  transition:transform .1s ease, filter .1s ease;
}
.idea-icon-opt.selected{border-color:var(--accent);background:var(--bg-card);}
.idea-icon-opt:active{transform:scale(0.85);}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  background:var(--bg-elev);border:1px solid var(--border);color:var(--text-dim);
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;
  transition:transform .1s ease, filter .1s ease;
}
.chip.selected{background:var(--accent);color:#04140f;border-color:var(--accent);}
.chip:active{transform:scale(0.92);}

.star-row{display:flex;gap:6px;}
.star-btn{font-size:24px;background:none;border:none;color:var(--text-dim);padding:2px;transition:transform .1s ease;}
.star-btn.filled{color:var(--warn);}
.star-btn:active{transform:scale(0.8);}

.idea-board{display:flex;flex-direction:column;gap:20px;}
.idea-group h4{
  margin:0 0 10px;font-size:13px;color:var(--text-dim);text-transform:uppercase;
  letter-spacing:.04em;font-weight:700;display:flex;justify-content:space-between;align-items:center;
}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
.idea-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:16px;
  padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  transition:transform .1s ease, filter .1s ease;
}
.idea-card:active{transform:scale(0.94);filter:brightness(0.9);}
.idea-card .idea-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;}
.idea-card .idea-title{font-size:12px;font-weight:700;line-height:1.2;}
.idea-card .idea-cat{font-size:10px;color:var(--text-dim);}

.collapse-header{
  width:100%;background:none;border:none;color:var(--text-dim);
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  padding:0;transition:opacity .1s ease;
}
.collapse-header:active{opacity:0.6;}
.collapse-caret{font-size:11px;color:var(--text-dim);}
.collapse-body{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.diario-entry-head{
  width:100%;background:none;border:none;color:var(--text);
  display:flex;justify-content:space-between;align-items:center;
  font-size:14px;font-weight:700;padding:0;transition:opacity .1s ease;
}
.diario-entry-head:active{opacity:0.6;}

.palette-swatch{width:52px;height:52px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;}
</style>
</head>
<body>
<div id="recovery-screen" class="hidden">
  <h2>Algo no ha ido bien</h2>
  <p style="color:var(--text-dim);font-size:14px;">La app tuvo un problema al cargar. Puedes recargar o reiniciar los datos guardados.</p>
  <button class="btn" id="recovery-reload">Recargar</button>
  <button class="btn danger" id="recovery-reset">Reiniciar datos</button>

<div id="pin-screen">
  <h2 id="pin-title">Crea tu PIN</h2>
  <p id="pin-subtitle">Este PIN protege el acceso a Vida en este dispositivo.</p>

  <div class="pin-error" id="pin-error"></div>
  <div class="pin-pad" id="pin-pad"></div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <button class="back-btn hidden" id="back-btn" aria-label="Volver">‹</button>

      <h1 id="home-title">Vida</h1>
      <div class="date" id="home-date"></div>
    </div>
    <button class="avatar-btn" id="avatar-btn" aria-label="Perfil">
      <img id="avatar-img" class="hidden" alt="">

  <div id="view-home">
    <div class="grid" id="home-grid"></div>
  </div>

  <div id="view-section" class="section hidden"></div>

  <div class="modal-sheet">
    <h2>¿Cómo has dormido?</h2>
    <p>Regístralo para llevar el seguimiento de tu descanso.</p>
    <div class="field"><label>Hora a la que te dormiste</label><input type="time" id="sleep-bed"></div>

      <button class="btn secondary" style="flex:1;" id="sleep-skip">Ahora no</button>
      <button class="btn" style="flex:1;" id="sleep-save">Guardar</button>
    </div>
  </div>
</div>

<script>
(function(){

function safeGet(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw === null) return fallback;
    return JSON.parse(raw);
  }catch(e){
    return fallback;
  }
}
function safeSet(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){
    return false;
  }
}

const SECTIONS = [
  {id:"calendario", icon:"📅", img:"icons/section-calendario.png", label:"Calendario", sub:"Eventos y avisos", accent:"#5ee6c8"},
  {id:"deporte", icon:"🏋️", img:"icons/section-deporte.png", label:"Deporte semanal", sub:"Estiramientos y racha", accent:"#ffb26b"},
  {id:"privado", icon:"🎯", img:"icons/section-privado.png", label:"Seguimiento privado", sub:"Sesiones y tiempos", accent:"#f5c542"},
  {id:"focus", icon:"⏱️", label:"Focus", sub:"Estudio y trabajo", accent:"#ff9f6b"},
  {id:"diario", icon:"📓", img:"icons/section-diario.png", label:"Diario", sub:"Notas del día", accent:"#c792ea"},
  {id:"proyectos", icon:"💡", label:"Proyectos", sub:"Ideas y trabajo", accent:"#6bd6ff"},
  {id:"recordatorios", icon:"🔔", label:"Recordatorios", sub:"Para más tarde", accent:"#ff6b6b"},
  {id:"finanzas", icon:"💶", img:"icons/section-finanzas.png", label:"Finanzas", sub:"Ingresos y gastos", accent:"#5ee68f"},
  {id:"sueno", icon:"😴", label:"Sueño", sub:"Horas y calidad", accent:"#ff8fd6"},
  {id:"estadisticas", icon:"📈", label:"Estadísticas generales", sub:"Resumen de todo", accent:"#6bd6ff"},
  {id:"objetivos", icon:"🏆", label:"Objetivos", sub:"Tablero 9×9", accent:"#f5c542"}
];
const PERFIL_SECTION = {id:"perfil", icon:"🧍", label:"Perfil", sub:"Datos y peso", accent:"#5ee6c8"};

const STATE_KEY = "vida_state_v1";
function defaultState(){
  return {
    calendar:{events:[]},
    sport:{weeks:{}, futbol:{entries:[]}, estiramientos:{streak:0, lastDate:null, entries:[]}, caminar:{entries:[]}, correr:{entries:[]}},
    privado:{sessions:[], passwordHash:null},
    focus:{running:null, categories:{proyectos:{sessions:[]}, busqueda:{sessions:[]}, estudio:{sessions:[]}}},
    diario:{entries:[]},
    proyectos:{items:[]},
    recordatorios:{items:[]},
    finanzas:{transactions:[]},
    perfil:{name:"", height:null, age:null, weights:[], photo:null, palette:"coral"},
    sueno:{logs:[], settings:{idealBed:"00:00", idealWake:"07:30"}},
    objetivos:{passwordHash:null, cells:[]}
  };
}
let state = safeGet(STATE_KEY, null);
if(!state){ state = defaultState(); safeSet(STATE_KEY, state); }
const DEFAULTS = defaultState();
Object.keys(DEFAULTS).forEach(k => { if(!state[k]) state[k] = DEFAULTS[k]; });

const SYNC_CONFIG_KEY = "vida_sync_config";
const STATE_META_KEY = "vida_state_meta";
const SYNC_ROW_ID = "daniel";
const PUSH_SUBSCRIBED_KEY = "vida_push_subscribed";
const VAPID_PUBLIC_KEY = "BAaSFJX0R7lfyysfKbA9y_G2A3evb1bTcOgCoj-EhRD6ENUBT5_ntK46W6iyoBmHE7M2_t28XzpVwomfFYngbh4";

let syncPushTimer = null;
function scheduleSync(){
  if(!syncConfig || !syncConfig.url || !syncConfig.anonKey) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(pushState, 1500);
}

async function pushState(){
  if(!syncConfig || !syncConfig.url || !syncConfig.anonKey) return;
  setSyncStatus("syncing");
  try{
    const res = await fetch(syncConfig.url + "/rest/v1/vida_state?on_conflict=id", {
      method:"POST",
      headers:{
        "apikey": syncConfig.anonKey,
        "Authorization": "Bearer " + syncConfig.anonKey,
        "Content-Type":"application/json",
        "Prefer":"resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify({id:SYNC_ROW_ID, data:state, updated_at: stateMeta.updatedAt})
    });
    if(res.ok){
      stateMeta.lastSyncedAt = new Date().toISOString();
      safeSet(STATE_META_KEY, stateMeta);
      setSyncStatus("synced");
    } else {
      setSyncStatus("error");
    }
  }catch(e){
    setSyncStatus("error");
  }
}

async function pullRemoteState(){
  if(!syncConfig || !syncConfig.url || !syncConfig.anonKey) return {ok:false, row:null};
  try{
    const res = await fetch(syncConfig.url + "/rest/v1/vida_state?id=eq." + SYNC_ROW_ID + "&select=data,updated_at", {
      headers:{
        "apikey": syncConfig.anonKey,
        "Authorization": "Bearer " + syncConfig.anonKey
      }
    });
    if(!res.ok) return {ok:false, row:null};
    const rows = await res.json();
    return {ok:true, row: rows.length ? rows[0] : null};
  }catch(e){
    return {ok:false, row:null};
  }
}

async function syncOnOpen(){
  if(!syncConfig || !syncConfig.url || !syncConfig.anonKey) return;
  setSyncStatus("syncing");
  const result = await pullRemoteState();
  if(!result.ok){
    setSyncStatus("error");
    return;
  }
  const remote = result.row;
  if(!remote){
    if(!stateMeta.updatedAt) stateMeta.updatedAt = new Date().toISOString();
    setSyncStatus("synced");
    await pushState();
    return;
  }
  const remoteTime = remote.updated_at ? new Date(remote.updated_at).getTime() : 0;
  const localTime = stateMeta.updatedAt ? new Date(stateMeta.updatedAt).getTime() : 0;
  if(remoteTime > localTime){
    state = remote.data;
    Object.keys(DEFAULTS).forEach(k => { if(!state[k]) state[k] = DEFAULTS[k]; });
    safeSet(STATE_KEY, state);
    stateMeta.updatedAt = remote.updated_at;
    stateMeta.lastSyncedAt = new Date().toISOString();
    safeSet(STATE_META_KEY, stateMeta);
    setSyncStatus("synced");
    if(!appRoot.classList.contains("hidden")){ renderHome(); renderAvatar(); }
  } else if(localTime > remoteTime){
    await pushState();
  } else {
    stateMeta.lastSyncedAt = new Date().toISOString();
    safeSet(STATE_META_KEY, stateMeta);
    setSyncStatus("synced");
  }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function localISO(date){
  return date.getFullYear() + "-" + String(date.getMonth()+1).padStart(2,"0") + "-" + String(date.getDate()).padStart(2,"0");
}
function todayISO(){ return localISO(new Date()); }
function fmtDate(d){
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("es-ES", {weekday:"short", day:"numeric", month:"short"});
}
function isoWeekKey(date){
  const d = new Date(date.getTime());
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7));
  const week1 = new Date(d.getFullYear(),0,4);
  const weekNo = 1 + Math.round(((d.getTime()-week1.getTime())/86400000 - 3 + ((week1.getDay()+6)%7))/7);
  return d.getFullYear() + "-W" + String(weekNo).padStart(2,"0");
}
function weekDates(weekKey){
  const [yearStr, wStr] = weekKey.split("-W");
  const year = parseInt(yearStr,10), week = parseInt(wStr,10);
  const jan4 = new Date(year,0,4);
  const monday = new Date(jan4.getTime());
  monday.setDate(jan4.getDate() - ((jan4.getDay()+6)%7) + (week-1)*7);
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday.getTime());
    d.setDate(monday.getDate()+i);
    days.push(localISO(d));
  }
  return days;
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if(children) children.forEach(c => { if(c) e.appendChild(c); });
  return e;
}

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function renderPasswordGate(root, stateKey, sectionLabel, unlockedGetter, unlockedSetter){
  if(unlockedGetter()) return true;

    card.appendChild(el("div",{class:"field"},[el("label",{},[document.createTextNode("Contraseña")]),pwInput]));

      const h = await sha256Hex(pwInput.value);
      if(h === rec.passwordHash){
        unlockedSetter(true);
        openSection(stateKey);
      } else {
        errorEl.textContent = "Contraseña incorrecta.";
        pwInput.value = "";
      }

      });

  root.appendChild(card);

function checkAndFinalizeFocusIfElapsed(){
  const r = state.focus.running;
  if(!r) return;
  const totalSecs = r.durationMin*60;
  const elapsed = Math.floor((Date.now()-r.startedAt)/1000);
  if(elapsed >= totalSecs){
    finishFocusSession(false);
  }
}

  const month = calendarViewDate.getMonth();
  const firstDay = new Date(year, month, 1);

    el("button",{onclick:() => { calendarViewDate = new Date(year, month-1, 1); openSection("calendario"); }},[document.createTextNode("‹")]),

  for(let d=1; d<=totalDays; d++){
    const ds = dateKey(year,month,d);

    if(ds === todayStr) classes.push("today");
    if(ds === calendarSelectedDate) classes.push("selected");

        if(!titleInput.value.trim()) return;

        if(isEdit){
          existingEvent.title = titleInput.value.trim();
          existingEvent.time = timeInput.value;
          existingEvent.notes = notesInput.value.trim();

          existingEvent.color = selectedColor;

function monthKey(dateStr){ return dateStr.slice(0,7); }

function allDoneDatesSet(){
  const set = new Set();
  Object.values(state.sport.weeks || {}).forEach(wd => {
    Object.entries(wd.days || {}).forEach(([d,v]) => { if(v) set.add(d); });
  });
  return set;
}

  return {
    futbol: state.sport.futbol.entries.map(e => e.date),

  };
}

function getWeekData(weekKey){
  if(!state.sport.weeks[weekKey]){
    state.sport.weeks[weekKey] = {days:{}};
  }
  return state.sport.weeks[weekKey];
}

function computeStreakFromEntries(entries){
  const set = new Set(entries);
  let streak = 0;
  const d = new Date();
  while(set.has(localISO(d))){
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function buildPieGradient(parts){
  // parts: [{color, pct}] with pct in 0..100, sum ~100
  let acc = 0;
  const stops = [];
  parts.forEach(p => {
    if(p.pct <= 0) return;
    const start = acc;
    acc += p.pct;
    stops.push(p.color + " " + start + "% " + acc + "%");
  });
  if(stops.length === 0) return "var(--bg-elev)";
  return "conic-gradient(" + stops.join(", ") + ")";
}

function formatMinutes(mins){
  if(mins < 60) return mins + " min";
  const h = Math.floor(mins/60), m = mins%60;
  return h + "h" + (m ? " " + m + "min" : "");
}

async function notifyFocusDone(catLabel, minutes){
  try{ if(navigator.vibrate) navigator.vibrate([250,120,250,120,500]); }catch(e){}
  try{
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    const title = "Focus terminado";
    const body = catLabel + " · " + minutes + " min completados";
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(title, {body, icon:"./icons/icon-192.png", badge:"./icons/icon-192.png"});
    } else {
      new Notification(title, {body});
    }
  }catch(e){}
}

function finishFocusSession(early){
  const r = state.focus.running;
  if(!r) return;
  const minutes = early
    ? Math.max(1, Math.round((Date.now()-r.startedAt)/60000))
    : r.durationMin;
  state.focus.categories[r.category].sessions.push({id:uid(), date:todayISO(), minutes});
  if(!early && r.notify){
    const cat = FOCUS_CATS.find(c => c.id === r.category);
    notifyFocusDone(cat ? cat.label : "Sesión", minutes);
  }
  state.focus.running = null;
  persist();
}

function renderFocusCategorySub(root, id){
  const cat = FOCUS_CATS.find(c => c.id === id);
  root.appendChild(focusSubHeader(cat.label));

  const running = state.focus.running;
  const isThisRunning = running && running.category === id;
  const timerCard = el("div",{class:"card", style:"align-items:center;"});

  if(running && !isThisRunning){
    const otherCat = FOCUS_CATS.find(c => c.id === running.category);
    timerCard.appendChild(el("p",{},[document.createTextNode("Ya tienes un cronómetro en marcha para " + otherCat.label + ".")]));
    timerCard.appendChild(el("button",{class:"btn secondary", style:"width:100%;", onclick:() => { focusSubView = running.category; openSection("focus"); }},[document.createTextNode("Ir al cronómetro")]));
  } else if(isThisRunning){
    const timerDisplay = el("div",{class:"focus-timer"},[document.createTextNode("00:00:00")]);
    timerCard.appendChild(timerDisplay);
    timerCard.appendChild(el("button",{class:"btn danger", style:"width:100%;", onclick:() => { finishFocusSession(true); openSection("focus"); }},[document.createTextNode("Detener y guardar")]));
    root.appendChild(timerCard);

    function tick(){
      const r = state.focus.running;
      if(!r){ if(focusTicker) clearInterval(focusTicker); return; }
      const totalSecs = r.durationMin*60;
      const elapsed = Math.floor((Date.now()-r.startedAt)/1000);
      const remaining = totalSecs - elapsed;
      if(remaining <= 0){
        clearInterval(focusTicker);
        finishFocusSession(false);
        openSection("focus");
        return;
      }
      const h = String(Math.floor(remaining/3600)).padStart(2,"0");
      const m = String(Math.floor((remaining%3600)/60)).padStart(2,"0");
      const s = String(remaining%60).padStart(2,"0");
      timerDisplay.textContent = h+":"+m+":"+s;
    }
    tick();
    focusTicker = setInterval(tick, 1000);
  } else {
    const durationSelect = el("select",{}, FOCUS_DURATIONS.map(m => el("option",{value:String(m)},[document.createTextNode(m + " min")])));

    ]));
    timerCard.appendChild(el("button",{class:"btn", style:"width:100%;", onclick:() => {
      if(notifyInput.checked) requestNotifPermission();

      persist();
      openSection("focus");
    }},[document.createTextNode("Empezar cuenta atrás")]));
    root.appendChild(timerCard);
  }

  const sessions = state.focus.categories[id].sessions.slice().sort((a,b) => b.id.localeCompare(a.id));
  const todayTotal = sessions.filter(s => s.date === todayISO()).reduce((a,s) => a+s.minutes,0);
  root.appendChild(el("div",{class:"card"},[
    el("h3",{},[document.createTextNode("Hoy")]),
    el("div",{class:"row"},[document.createTextNode("Tiempo acumulado"), el("strong",{},[document.createTextNode(formatMinutes(todayTotal))])])
  ]));

  const historyCard = el("div",{class:"card"},[el("h3",{},[document.createTextNode("Historial")])]);
  const list = el("div",{class:"list"});
  if(sessions.length === 0){
    list.appendChild(el("div",{class:"empty-msg"},[document.createTextNode("Sin sesiones registradas todavía.")]));
  } else {
    sessions.slice(0,15).forEach(s => {
      list.appendChild(el("div",{class:"item"},[
        el("div",{class:"top"},[
          el("strong",{},[document.createTextNode(fmtDate(s.date))]),
          el("span",{class:"icon-x", onclick:() => {
            confirmDeleteGeneric("¿Eliminar sesión?", "La sesión del " + fmtDate(s.date) + " se eliminará permanentemente.", () => {
              state.focus.categories[id].sessions = state.focus.categories[id].sessions.filter(x => x.id !== s.id);
              persist(); openSection("focus");
            });
          }},[document.createTextNode("✕")])
        ]),
        el("div",{class:"meta"},[document.createTextNode(formatMinutes(s.minutes))])
      ]));
    });

  historyCard.appendChild(list);
  root.appendChild(historyCard);

function ensureRecurringFinanzas(){
  const txs = state.finanzas.transactions;
  const bySeries = {};
  txs.filter(t => t.recurring && t.seriesId).forEach(t => {
    if(!bySeries[t.seriesId] || t.date > bySeries[t.seriesId].date) bySeries[t.seriesId] = t;
  });
  let changed = false;
  const todayStr = todayISO();
  Object.values(bySeries).forEach(latest => {
    let cur = latest;
    let guard = 0;
    while(guard < 24){
      const d = new Date(cur.date + "T00:00:00");
      const nextMonthFirst = new Date(d.getFullYear(), d.getMonth()+1, 1);
      const daysInNext = new Date(nextMonthFirst.getFullYear(), nextMonthFirst.getMonth()+1, 0).getDate();
      const targetDay = Math.min(d.getDate(), daysInNext);
      const nextDate = new Date(nextMonthFirst.getFullYear(), nextMonthFirst.getMonth(), targetDay);
      const nextDateStr = localISO(nextDate);
      if(nextDateStr > todayStr) break;
      let match = txs.find(t => t.seriesId === cur.seriesId && t.date === nextDateStr);
      if(!match){
        match = {id:uid(), type:cur.type, category:cur.category, amount:cur.amount, date:nextDateStr, recurring:true, seriesId:cur.seriesId};
        txs.push(match);
        changed = true;
      }
      cur = match;
      guard++;
    }
  });
  if(changed) persist();
}

function imcCategory(imc){
  if(imc < 18.5) return {label:"Por debajo del rango saludable", advice:"Podrías necesitar ganar peso.", cls:"warn"};
  if(imc < 25) return {label:"Rango saludable", advice:"Tu peso está dentro del rango recomendado.", cls:""};
  if(imc < 30) return {label:"Por encima del rango saludable", advice:"Podría convenirte bajar algo de peso.", cls:"warn"};
  return {label:"Muy por encima del rango saludable", advice:"Sería recomendable bajar de peso.", cls:"danger"};
}
function monthsBetween(d1, d2){
  return (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
}
function needsWeightUpdate(){
  const weights = state.perfil.weights;
  if(weights.length === 0) return false;
  const last = weights[weights.length-1];
  const lastDate = new Date(last.date + "T00:00:00");
  return monthsBetween(lastDate, new Date()) >= 1;
}

function pushStatusLabel(){
  if(!("PushManager" in window)) return {text:"No soportado en este navegador", cls:"danger"};
  if(!("Notification" in window)) return {text:"No soportado", cls:"danger"};
  if(Notification.permission === "denied") return {text:"Bloqueado por el sistema", cls:"danger"};
  if(safeGet(PUSH_SUBSCRIBED_KEY, false)) return {text:"Activado en este dispositivo", cls:""};
  return {text:"No activado todavía", cls:"warn"};
}

function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function enablePushNotifications(log){
  log = log || function(){};
  if(swRegistrationError){
    log("Aviso: el registro inicial del Service Worker había fallado con: " + swRegistrationError + ". Reintentando ahora...");
  }
  log("Paso 1: comprobando soporte del navegador...");
  if(!("serviceWorker" in navigator)){
    log("Paso 1 falló: este navegador no soporta Service Worker.");
    return false;
  }
  if(!("Notification" in window)){
    log("Paso 2 falló: este navegador no soporta Notification.");
    return false;
  }
  log("Paso 2: pidiendo permiso de notificaciones...");
  let perm;
  try{
    perm = await Notification.requestPermission();
  }catch(e){
    log("Paso 3 falló (pedir permiso): " + e.name + " - " + e.message);
    return false;
  }
  if(perm !== "granted"){
    log("No se concedió el permiso de notificaciones (estado: " + perm + ").");
    return false;
  }
  try{
    log("Paso 4: comprobando si ./sw.js se sirve correctamente...");
    try{
      const swFileRes = await fetch("./sw.js", {cache:"no-store"});
      log("Paso 4: ./sw.js -> HTTP " + swFileRes.status + ", content-type: " + swFileRes.headers.get("content-type"));
    }catch(fetchErr){
      log("Paso 4: no se pudo ni descargar ./sw.js: " + fetchErr.name + " - " + fetchErr.message);
    }
    log("Paso 4: comprobando el registro del Service Worker (scope: " + location.href + ")...");
    let existingReg = await navigator.serviceWorker.getRegistration();
    if(!existingReg){
      log("Paso 4: no había registro, registrando sw.js ahora...");
      try{
        existingReg = await navigator.serviceWorker.register("./sw.js");
        log("Paso 4: register() resolvió. scope=" + existingReg.scope + " installing=" + !!existingReg.installing + " waiting=" + !!existingReg.waiting + " active=" + !!existingReg.active);
      }catch(regErr){
        log("Paso 4 falló (register): " + regErr.name + " - " + regErr.message);
        return false;
      }
    } else {
      log("Paso 4: ya había un registro. scope=" + existingReg.scope + " installing=" + !!existingReg.installing + " waiting=" + !!existingReg.waiting + " active=" + !!existingReg.active);
    }
    log("Paso 4: esperando a que quede activo (hasta 10s)...");
    const swReadyTimeout = new Promise((_, rej) => setTimeout(() => rej(new Error("Tiempo de espera agotado tras 10s. Estado del registro: installing=" + !!existingReg.installing + " waiting=" + !!existingReg.waiting + " active=" + !!existingReg.active)), 10000));
    const reg = await Promise.race([navigator.serviceWorker.ready, swReadyTimeout]);
    if(!("pushManager" in reg)){
      log("Paso 4 falló: este dispositivo no soporta Push aquí. Asegúrate de abrir la app desde el icono de la pantalla de inicio, no desde Safari, y que sea iOS 16.4 o superior.");
      return false;
    }
    log("Paso 5: creando la suscripción push...");
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    if(!syncConfig || !syncConfig.url || !syncConfig.anonKey){
      log("Paso 6 falló: la sincronización con Supabase no está configurada. Ve arriba, guarda la URL y la clave, y vuelve a intentarlo.");
      return false;
    }
    log("Paso 6: guardando la suscripción en Supabase...");
    const res = await fetch(syncConfig.url + "/rest/v1/vida_push_subscriptions?on_conflict=id", {
      method:"POST",
      headers:{
        "apikey": syncConfig.anonKey,
        "Authorization": "Bearer " + syncConfig.anonKey,
        "Content-Type":"application/json",
        "Prefer":"resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify({id:SYNC_ROW_ID, subscription: sub, updated_at: new Date().toISOString()})
    });
    if(!res.ok){
      const text = await res.text();
      log("Paso 6 falló: Supabase respondió " + res.status + " - " + text);
      return false;
    }
    safeSet(PUSH_SUBSCRIBED_KEY, true);
    log("Notificaciones push activadas correctamente.");
    return true;
  }catch(e){
    log("Falló en Paso 4 o 5: " + e.name + " - " + e.message);
    return false;
  }
}

function compressPhotoFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("No se pudo leer la imagen"));
      img.onload = () => {
        const size = 320;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function sleepHours(bed, wake){
  const [bh,bm] = bed.split(":").map(Number);
  const [wh,wm] = wake.split(":").map(Number);
  let start = bh*60+bm;
  let end = wh*60+wm;
  if(end <= start) end += 24*60;
  return (end-start)/60;
}
function estimateRemCycles(hours){
  return Math.floor((hours*60)/90);
}
function timeToMinutes(t){
  const [h,m] = t.split(":").map(Number);
  return h*60+m;
}
function ensureSuenoShape(){
  if(!state.sueno.settings) state.sueno.settings = {idealBed:"00:00", idealWake:"07:30"};
  if(!state.sueno.settings.idealBed) state.sueno.settings.idealBed = "00:00";
  if(!state.sueno.settings.idealWake) state.sueno.settings.idealWake = "07:30";
}
function computeSleepScore(bed, wake, hours){
  ensureSuenoShape();
  const idealBedMins = timeToMinutes(state.sueno.settings.idealBed);
  const idealWakeMins = timeToMinutes(state.sueno.settings.idealWake);
  const bedMins = timeToMinutes(bed);
  const wakeMins = timeToMinutes(wake);
  const idealBedAdj = idealBedMins < 12*60 ? idealBedMins + 1440 : idealBedMins;
  const bedAdj = bedMins < 12*60 ? bedMins + 1440 : bedMins;
  const bedDiff = Math.abs(bedAdj - idealBedAdj);
  const bedScore = Math.max(0, 2.5 - (bedDiff/180)*2.5);
  const wakeDiff = Math.abs(wakeMins - idealWakeMins);
  const wakeScore = Math.max(0, 2.5 - (wakeDiff/180)*2.5);
  const hoursScore = Math.max(0, 5 - 0.3*Math.pow(hours-8, 2));
  const total = Math.min(10, Math.max(0, hoursScore + bedScore + wakeScore));
  return Math.round(total*10)/10;
}
function sleepScoreLabel(score){
  if(score >= 8) return {label:"Bien", cls:""};
  if(score >= 5) return {label:"Regular", cls:"warn"};
  return {label:"Mal", cls:"danger"};
}
function todaySleepLog(){
  return state.sueno.logs.find(l => l.date === todayISO());
}

function ensureObjetivosShape(){
  if(!state.objetivos) state.objetivos = {passwordHash:null, groups:[]};
  if(state.objetivos.passwordHash === undefined) state.objetivos.passwordHash = null;
  if(!Array.isArray(state.objetivos.groups) || state.objetivos.groups.length !== 9){
    const oldCells = Array.isArray(state.objetivos.cells) ? state.objetivos.cells : null;
    const groups = [];
    for(let g=0; g<9; g++){
      const items = [];
      for(let i=0;i<9;i++){
        const old = oldCells ? oldCells[g*9+i] : null;
        items.push(old ? {text:old.text||"", done:!!old.done} : {text:"", done:false});
      }
      groups.push({title:"", items});
    }
    state.objetivos.groups = groups;
    delete state.objetivos.cells;
  }
}

  const doneThisMonth = Array.from(doneSet).filter(d => monthKey(d) === curMonthKey).length;
  const streak = computeStreakFromEntries(state.sport.estiramientos.entries);
  const futbolThisMonth = state.sport.futbol.entries.filter(e => monthKey(e.date) === curMonthKey).length;
  root.appendChild(el("div",{class:"card"},[
    el("h3",{},[document.createTextNode("🏋️ Deporte")]),
    el("div",{class:"row"},[document.createTextNode("Días activos este mes"), el("strong",{},[document.createTextNode(String(doneThisMonth))])]),
    el("div",{class:"row"},[document.createTextNode("Racha de estiramientos"), el("strong",{},[document.createTextNode(streak + (streak===1?" día":" días"))])]),
    el("div",{class:"row"},[document.createTextNode("Partidos de fútbol este mes"), el("strong",{},[document.createTextNode(String(futbolThisMonth))])])
  ]));

  ensureFocusShape();
  const focusTotal = FOCUS_CATS.reduce((a,c) => a + state.focus.categories[c.id].sessions.filter(s => monthKey(s.date)===curMonthKey).reduce((x,s)=>x+s.minutes,0), 0);
  root.appendChild(el("div",{class:"card"},[
    el("h3",{},[document.createTextNode("⏱️ Focus")]),
    el("div",{class:"row"},[document.createTextNode("Tiempo total este mes"), el("strong",{},[document.createTextNode(formatMinutes(focusTotal))])])
  ]));

  ensureSuenoShape();
  const suenoThisMonth = state.sueno.logs.filter(l => monthKey(l.date)===curMonthKey);
  const avgScore = suenoThisMonth.length ? (suenoThisMonth.reduce((a,l)=>a+(l.score||0),0)/suenoThisMonth.length) : null;
  root.appendChild(el("div",{class:"card"},[
    el("h3",{},[document.createTextNode("😴 Sueño")]),
    el("div",{class:"row"},[document.createTextNode("Noches registradas este mes"), el("strong",{},[document.createTextNode(String(suenoThisMonth.length))])]),
    el("div",{class:"row"},[document.createTextNode("Nota media"), el("strong",{},[document.createTextNode(avgScore!=null ? avgScore.toFixed(1)+"/10" : "—")])])
  ]));

  const txsThisMonth = state.finanzas.transactions.filter(t => monthKey(t.date)===curMonthKey);
  const incomeMonth = txsThisMonth.filter(t=>t.type==="ingreso").reduce((a,t)=>a+t.amount,0);
  const expenseMonth = txsThisMonth.filter(t=>t.type==="gasto").reduce((a,t)=>a+t.amount,0);
  root.appendChild(el("div",{class:"card"},[
    el("h3",{},[document.createTextNode("💶 Finanzas")]),
    el("div",{class:"row"},[document.createTextNode("Ingresos este mes"), el("strong",{style:"color:var(--money-pos);"},[document.createTextNode(incomeMonth.toFixed(2)+" €")])]),
    el("div",{class:"row"},[document.createTextNode("Gastos este mes"), el("strong",{style:"color:var(--danger);"},[document.createTextNode(expenseMonth.toFixed(2)+" €")])]),
    el("div",{class:"row"},[document.createTextNode("Balance"), el("strong",{},[document.createTextNode((incomeMonth-expenseMonth).toFixed(2)+" €")])])
  ]));

  const diarioThisMonth = state.diario.entries.filter(e => monthKey(e.date)===curMonthKey).length;
  root.appendChild(el("div",{class:"card"},[
    el("h3",{},[document.createTextNode("📓 Diario")]),
    el("div",{class:"row"},[document.createTextNode("Entradas este mes"), el("strong",{},[document.createTextNode(String(diarioThisMonth))])])
  ]));

  const pendingCount = state.recordatorios.items.filter(r => !r.done).length;
  root.appendChild(el("div",{class:"card"},[
    el("h3",{},[document.createTextNode("🔔 Recordatorios")]),
    el("div",{class:"row"},[document.createTextNode("Pendientes"), el("strong",{},[document.createTextNode(String(pendingCount))])])
  ]));

  const enMarcha = state.proyectos.items.filter(i => i.status === "en-marcha").length;
  root.appendChild(el("div",{class:"card"},[
    el("h3",{},[document.createTextNode("💡 Proyectos")]),
    el("div",{class:"row"},[document.createTextNode("Ideas totales"), el("strong",{},[document.createTextNode(String(state.proyectos.items.length))])]),
    el("div",{class:"row"},[document.createTextNode("En marcha"), el("strong",{},[document.createTextNode(String(enMarcha))])])
  ]));
}

const PIN_KEY = "vida_pin";
const pinScreen = document.getElementById("pin-screen");
const pinTitle = document.getElementById("pin-title");
const pinSubtitle = document.getElementById("pin-subtitle");
const pinDots = document.getElementById("pin-dots");
const pinPad = document.getElementById("pin-pad");
const pinError = document.getElementById("pin-error");
const appRoot = document.getElementById("app");
const PIN_LENGTH = 4;

function buildPinPad(){
  pinPad.innerHTML = "";
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  keys.forEach(k => {
    if(k === ""){
      pinPad.appendChild(el("div",{}));
      return;
    }
    pinPad.appendChild(el("button",{class:"pin-key", onclick:() => onPinKey(k)},[document.createTextNode(k)]));
  });
}
function renderPinDots(){
  pinDots.innerHTML = "";
  for(let i=0;i<PIN_LENGTH;i++){
    pinDots.appendChild(el("div",{class:"pin-dot" + (i < pinBuffer.length ? " filled" : "")}));
  }
}

let pinBuffer = "";
let pinStage = "enter";
let firstPin = "";
const savedPin = safeGet(PIN_KEY, null);

function onPinKey(k){
  pinError.textContent = "";
  if(k === "⌫"){
    pinBuffer = pinBuffer.slice(0,-1);
    renderPinDots();
    return;
  }
  if(pinBuffer.length >= PIN_LENGTH) return;
  pinBuffer += k;
  renderPinDots();
  if(pinBuffer.length === PIN_LENGTH){
    setTimeout(handlePinComplete, 150);
  }
}

function handlePinComplete(){
  if(!savedPin){
    if(pinStage === "enter"){
      firstPin = pinBuffer;
      pinBuffer = "";
      pinStage = "confirm";
      pinTitle.textContent = "Confirma tu PIN";
      pinSubtitle.textContent = "Vuelve a escribirlo para confirmarlo.";
      renderPinDots();
    } else {
      if(pinBuffer === firstPin){
        safeSet(PIN_KEY, firstPin);
        unlockApp();
      } else {
        pinError.textContent = "Los PIN no coinciden, inténtalo de nuevo.";
        pinBuffer = "";
        firstPin = "";
        pinStage = "enter";
        pinTitle.textContent = "Crea tu PIN";
        pinSubtitle.textContent = "Este PIN protege el acceso a Vida en este dispositivo.";
        renderPinDots();
      }
    }
  } else {
    if(pinBuffer === savedPin){
      unlockApp();
    } else {
      pinError.textContent = "PIN incorrecto";
      pinBuffer = "";
      renderPinDots();
    }
  }
}

const sleepModal = document.getElementById("sleep-modal");
const sleepBedInput = document.getElementById("sleep-bed");
const sleepWakeInput = document.getElementById("sleep-wake");
document.getElementById("sleep-skip").addEventListener("click", () => sleepModal.classList.add("hidden"));
document.getElementById("sleep-save").addEventListener("click", () => {
  if(!sleepBedInput.value || !sleepWakeInput.value){
    sleepModal.classList.add("hidden");
    return;
  }
  const hours = sleepHours(sleepBedInput.value, sleepWakeInput.value);
  const remCycles = estimateRemCycles(hours);
  const entry = {date:todayISO(), bed:sleepBedInput.value, wake:sleepWakeInput.value, hours, remCycles};
  const idx = state.sueno.logs.findIndex(l => l.date === todayISO());
  if(idx >= 0) state.sueno.logs[idx] = entry; else state.sueno.logs.push(entry);
  persist();
  sleepModal.classList.add("hidden");
});

function maybeShowSleepPrompt(){
  if(!todaySleepLog()){
    sleepBedInput.value = "";
    sleepWakeInput.value = "";
    sleepModal.classList.remove("hidden");
  }
}

function unlockApp(){
  pinScreen.classList.add("hidden");
  appRoot.classList.remove("hidden");
  checkAndFinalizeFocusIfElapsed();
  renderHome();
  renderAvatar();
  maybeShowSleepPrompt();
  syncOnOpen();
}

function initPinScreen(){
  if(savedPin){
    pinTitle.textContent = "Introduce tu PIN";
    pinSubtitle.textContent = "Desbloquea Vida para continuar.";
  }
  buildPinPad();
  renderPinDots();
}

let swRegistrationError = null;
function registerServiceWorker(){
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch((e) => { swRegistrationError = e.name + " - " + e.message; console.error("Fallo registrando sw.js:", e); });
  }
}

function initHapticFeedback(){
  const selector = "button, .cal-day:not(.empty), .day-chip, .month-cell, .idea-icon-opt, .chip, .star-btn, .color-swatch, .tile";
  document.addEventListener("click", (e) => {
    const target = e.target.closest(selector);
    if(!target) return;
    try{ if(navigator.vibrate) navigator.vibrate(10); }catch(err){}
  }, true);
}

function init(){
  initPinScreen();
  registerServiceWorker();
  initHapticFeedback();
  try{
    document.addEventListener("touchstart", function(){}, {passive:true});
  }catch(e){}
  if(state && state.perfil && state.perfil.palette){
    applyPalette(state.perfil.palette);
  }
}

const recoveryScreen = document.getElementById("recovery-screen");
document.getElementById("recovery-reload").addEventListener("click", () => location.reload());
document.getElementById("recovery-reset").addEventListener("click", () => {
  try{ localStorage.clear(); }catch(e){}
  location.reload();
});

try{
  init();
}catch(e){
  recoveryScreen.classList.remove("hidden");
}

window.addEventListener("error", () => {
  if(appRoot.classList.contains("hidden") && pinScreen.classList.contains("hidden")){
    recoveryScreen.classList.remove("hidden");
  }
});

})();
</script>
